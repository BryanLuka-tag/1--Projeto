<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" id="icon" type="image/x-icon" href="Image/Firefly.png">
    <title>Cadastro</title>
    <style>
        :root {
            /* cores de uso geral */
            --cor-principal: #1A2E40;
            --cor-secundária: #3D5A73;
            --cor-terciária: #F2F2F2;
            --cor-suporte1: #BACBD9;
            --cor-suporte3: #748494;
            /* cores Básicas */
            --cor-basica1: #ffffff;
            --cor-basica2: #000000;
            /* tipografia */
            --tipografia: font 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #email {
            display: block;
            margin-bottom: 25px;
        }

        #inscricao {
            background-image: linear-gradient(to bottom, #1A2E40, #3D5A73 60%);
            color: var(--cor-basica1);
            text-shadow: 1px 1px 1px var(--cor-basica2);
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
        }

        #inscricao:hover {
            background-image: linear-gradient(-45deg, #1A2E40, #3D5A73 60%);
        }

        /* font Family */
        @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap');


        header {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 15px;
            gap: 15px;
            padding: 25px 0;

            background-image: linear-gradient(45deg, #1A2E40, #3D5A73 60%);
            text-align: center;

        }

        main {
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            text-align: justify;
        }

        form {
            color: var(--cor-basica1);
            margin: 50px;
            border-radius: 15px;
            background-image: linear-gradient(45deg, #1A2E40, #3D5A73 60%);
            padding: 50px 50px;
        }

        fieldset label {
            margin: 10px;
            display: block;
        }

        legend {
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            color: var(--cor-basica1);
            font-size: 20px;
        }

        footer {
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            border-radius: 15px;
            padding: 1px 0px;
            color: var(--cor-basica1);
            text-align: center;
            background-image: linear-gradient(45deg, #1A2E40, #3D5A73 60%);
        }

        h2 {
            text-align: center;
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            color: var(--cor-basica1);
        }

        h1 {
            display: block;
            margin: 0 auto;
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            color: var(--cor-basica1);
            text-align: center;

        }
    </style>
</head>

<body>

    <header>
        <section class="logoheader">
            <img src="Image/Firefly.png" alt="icone da página" width="120" height="120">
            </img>  
            <h1>Vivendo a Servir</h1>
            <h2>Página de cadastro</h2>
        </section>
    </header>
    
    <main id="formulario">
        <form action="formulário de cadastro" method="post">
            <fieldset>
                <legend>Dados Pessoas</legend>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" pattern="[A-Za-zÀ-ÿ\s]+"
                    placeholder="Ex: João da Silva" title=" nome deve conter apenas letras, não utilize número ou síbolos.">

                <label for="CPF">CPF:</label>
                <input type="text" id="CPF" name="CPF" maxlength="11" pattern="\d{11}"
                    placeholder="Ex: 12345678901" title="Digite o CPF com 11 dígitos, sem traços e pontos.">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{10,11}" maxlength="11"
                    placeholder="Ex: 11987654321" required title="Digite apenas números, com DDD e 9 ou 8 dígitos.">

                <label for="data-nascimento">Data de Nascimento:</label>
                <input type="date" id="data-nascimento" name="data-nascimento">
                
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" maxlength="9"
                    placeholder="Ex: 12345-678" required title="Digite o CEP no formato 12345-678.">

                <label for="e-mail">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Ex: joao@email.com" title="Digite seu e-mail">

                <!-- Botão de enviar -->
                <button type="submit" id="inscricao" value="Enviar">
                    Enviar
                </button>
            </fieldset>
        </form>
    </main>

    <footer>
        <p class="pfooter">Pensado por Bryan Luka &#128084; <br> &copy; 2026. Todos os direitos reservados.<br> Por um
            Mundo
            Melhor&trade;</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>

</html>
