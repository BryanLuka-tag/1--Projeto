<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="Image/Firefly.png">
    <title>Doação</title>
    <style>
        :root {
            /* cores de uso geral */
            --cor-principal: #1A2E40;
            --cor-secundária: #3D5A73;
            --cor-terciária: #F2F2F2;
            --cor-suporte1: #BACBD9;
            --cor-suporte3: #748494;
            /* cores Básicas */
            --cor-basica1: #ffffff;
            --cor-basica2: #000000;
            /* tipografia */
            --tipografia: font 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        header {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 15px;
            gap: 15px;
            padding: 25px 0px;

            background-image: linear-gradient(45deg, #1A2E40, #3D5A73 60%);
            text-align: center;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
        }

        main{
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            text-align: justify;
        }

        form {
            color: var(--cor-basica1);  
            margin: 50px;
            border-radius: 15px;
            background-image: linear-gradient(45deg, #1A2E40, #3D5A73 60%);
            padding: 50px 50px;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .doacao {
            display: flex;
            margin: auto;
            flex-direction: column;
            gap: 15px;
        }

        button {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(to bottom, #1A2E40, #3D5A73 60%);
            color: var(--cor-basica1);
            text-shadow: 1px 1px 1px var(--cor-basica2);
            padding: 10px 20px;
            margin-left: 30px;
            border-radius: 15px;
            cursor: pointer;   
            

        }
         
        span {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        button:hover {
            background-image: linear-gradient(-45deg, #1A2E40, #3D5A73 60%);
        }

        h2 {
            text-align: center;
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            color: var(--cor-basica1);
        }

        h1 {
            display: block;
            margin: 0 auto;
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            color: var(--cor-basica1);
            text-align: center;

        }

        footer {
            text-shadow: 1px 1.5px 1px var(--cor-basica2);
            border-radius: 15px;
            padding: 1px 0px;
            color: var(--cor-basica1);
            text-align: center;
            background-image: linear-gradient(45deg, #1A2E40, #3D5A73 60%);
        }
    </style>

</head>

<body>
    <header>
        <div class="logoheader">
            <img src="Image/Firefly.png" alt="icone da página" width="120" height="120">
            <h1>Vivendo a Servir</h1>
            <h2>Doe e faça a diferença na vida de alguém!</h2>
            </image>
        </div>
    </header>

    <main>
        
        <form>
            <section class="Doacao">
                <div class="doacao">
                    <span>Para doar 15 R$<button>Doar</button></span>
                    <span>Para doar 30 R$<button>Doar</button></span>
                    <span>Para doar 50 R$<button>Doar</button></span>
                    <span>Para doar 100 R$<button>Doar</button></span>
                </div>
            </section>
        </form>
    </main>

</body>

<footer>
        <p class="pfooter">Pensado por Bryan Luka &#128084; <br> &copy; 2026. Todos os direitos reservados.<br> Por um
            Mundo
            Melhor&trade;</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</html>
